{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Arama Sonuçları</h2>
</div>
{% if message %}
  <div class="alert alert-info">{{ message }}</div>
  {% include "_manual_form.html" %}
{% endif %}
{% if results %}
<div class="book-grid">
  {% for book in results %}
  <article class="book-card search-card">
    <img class="book-cover" src="{{ book.cover_url or url_for('static', filename='kapak-yok.svg') }}" alt="">
    <h3>{{ book.title }}</h3>
    <p class="book-author">{{ book.author }}</p>
    <small>{{ book.publisher }}</small>
    <form method="post" action="{{ url_for('add_from_search') }}" class="mt-3">
      <input type="hidden" name="title" value="{{ book.title }}">
      <input type="hidden" name="author" value="{{ book.author }}">
      <input type="hidden" name="publisher" value="{{ book.publisher }}">
      <input type="hidden" name="cover_url" value="{{ book.cover_url }}">
      <input type="hidden" name="page_count" value="{{ book.page_count }}">
      <input type="hidden" name="isbn" value="{{ book.isbn }}">
      <input type="hidden" name="publication_year" value="{{ book.publication_year }}">
      <div class="shelf-actions">
        <button class="btn btn-shelf-gray" name="status" value="okunacak">Okunacak</button>
        <button class="btn btn-shelf-orange" name="status" value="okunuyor">Okunuyor</button>
        <button class="btn btn-shelf-green" name="status" value="okundu">Okundu</button>
      </div>
    </form>
  </article>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
